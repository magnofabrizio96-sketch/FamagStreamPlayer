name: Build Famag Stream Player

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Configura Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compila APK
        run: gradle --version && gradle assembleDebug

      - name: Pubblica APK
        uses: actions/upload-artifact@v4
        with:
          name: FamagStreamPlayer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
